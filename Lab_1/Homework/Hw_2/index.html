<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive Drum Kit" />
    <title>Drum Kit</title>
  </head>
  <body>
    <div class="drum-kit">
      <div class="key" data-key="65" data-sound="kick">
        <kbd>A</kbd>
        <span class="sound">Kick</span>
      </div>

      <div class="key" data-key="83" data-sound="snare">
        <kbd>S</kbd>
        <span class="sound">Snare</span>
      </div>

      <div class="key" data-key="68" data-sound="hihat">
        <kbd>D</kbd>
        <span class="sound">Hi-Hat</span>
      </div>

      <div class="key" data-key="70" data-sound="clap">
        <kbd>F</kbd>
        <span class="sound">Clap</span>
      </div>

      <div class="key" data-key="71" data-sound="openhat">
        <kbd>G</kbd>
        <span class="sound">Open Hat</span>
      </div>

      <div class="key" data-key="72" data-sound="boom">
        <kbd>H</kbd>
        <span class="sound">Boom</span>
      </div>

      <div class="key" data-key="74" data-sound="ride">
        <kbd>J</kbd>
        <span class="sound">Ride</span>
      </div>

      <div class="key" data-key="75" data-sound="tom">
        <kbd>K</kbd>
        <span class="sound">Tom</span>
      </div>

      <div class="key" data-key="76" data-sound="tink">
        <kbd>L</kbd>
        <span class="sound">Tink</span>
      </div>
    </div>
  </body>
</html>
