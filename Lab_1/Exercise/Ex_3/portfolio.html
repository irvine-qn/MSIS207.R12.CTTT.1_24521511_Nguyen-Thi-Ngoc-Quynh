<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex_4</title>
  </head>
  <body>
    <section class="hero-section">
      <img
        src="image.png"
        alt="Chân dung lập trình viên"
        width="150"
        height="150"
        class="hero-avatar"
      />
      <h1>Xin chào, tôi là Lập trình viên Web</h1>
      <p class="pitch">
        Chuyên phát triển các ứng dụng web tối ưu hiệu năng và trải nghiệm người
        dùng.
      </p>
    </section>
    
    <article class="project-card" data-category="frontend">
      <header class="card-header">
        <h3>Distributed State Engine</h3>
        <span class="badge">TypeScript</span>
      </header>
      <p>Lightweight event bus built without external libraries.</p>
      <footer class="card-footer">
        <a href="#" aria-label="View State Engine repository">Source Code</a>
      </footer>
    </article>
    <!-- HTML -->
    <button id="theme-toggle" aria-pressed="false" aria-label="Đổi giao diện">
      <span id="theme-icon">🌙</span>
    </button>

    <!-- JavaScript -->
    <script>
      const toggleBtn = document.getElementById("theme-toggle");
      const icon = document.getElementById("theme-icon");

      toggleBtn.addEventListener("click", () => {
        const isDark = toggleBtn.getAttribute("aria-pressed") === "true";
        toggleBtn.setAttribute("aria-pressed", !isDark);
        document.body.classList.toggle("dark-theme", !isDark);
        icon.textContent = !isDark ? "☀️" : "🌙";
      });
    </script>
  </body>
</html>
